<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages SPA fallback: unknown paths serve this file as 404.
      // Remember the requested route and bounce to the app entry; the app
      // (src/main.jsx) restores the route from sessionStorage so React
      // Router renders the correct page.
      sessionStorage.setItem('dih:redirect', location.pathname + location.search);
      location.replace('/DATAOPS-INSIGHT-HUB/');
    </script>
  </head>
  <body></body>
</html>
